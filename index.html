<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetup Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="side">
  <h1>🚗 Meetup Planner</h1>
  <div class="row">
    <input type="text" id="q" placeholder="Search an address or place">
    <button id="go">Find</button>
  </div>
  <div class="mode">
    <label><input type="radio" name="m" value="friend" checked> Add friend</label>
    <label><input type="radio" name="m" value="dest"> Set destination</label>
  </div>
  <div id="note">Pick a mode, then search or click the map to drop a pin.</div>
  <div id="list"></div>
  <div class="row">
    <button id="calc">Calculate drive times</button>
    <button class="alt" id="clear">Reset</button>
  </div>
  <div id="sum"></div>
</div>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/script.js">

</script>
</body>
</html>
